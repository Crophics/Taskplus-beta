<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- interactive-widget=resizes-content (Safari 16.4+/iOS 16.4+, Chrome 108+):
     makes the keyboard actually resize the layout viewport instead of just
     overlaying it on top of a separately-tracked "visual viewport". Without
     it, position:fixed elements (the tab bar) reference stale geometry
     across a keyboard open/close and only resync on a real native scroll -
     which is why nothing done from JS after the fact (nudging scroll,
     forcing a reflow) reliably fixed the tab bar staying elevated: those
     are downstream patches for a state mismatch this flag prevents outright. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Taskplus</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="shortcut icon" href="icons/favicon.ico" type="image/x-icon">
<meta name="theme-color" content="#161826">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taskplus">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="module" src="firebase-sync.js"></script>
<script>
(function(){
  try{
    var prefs = JSON.parse(localStorage.getItem('tp-prefs')||'{}');
    var theme = ['dark','light','blue','auto'].includes(prefs.theme) ? prefs.theme : 'dark';
    var eff = theme;
    if(theme==='auto'){
      eff = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', eff);
  }catch(e){
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>
<script>
// --app-height: css/mobile.css sizes the page shell off this instead of
// 100dvh directly. The stuck-tab-bar bug survived removing position:fixed
// entirely (the tab bar is a normal flex child now, sized purely by its
// container's height) - which means the bug was never really about fixed
// positioning specifically. It's that the underlying viewport HEIGHT VALUE
// itself is what's stale right after the on-screen keyboard closes in this
// standalone-PWA/WKWebView context, and that stale value cascades into
// anything sized off it, dvh unit or not. window.visualViewport's own
// resize event reliably reports the correct live height when it fires
// (already relied on for the Add sheet's own keyboard-avoidance padding,
// which has never been reported broken) - so drive the page height from
// that JS-observed value via a custom property instead of trusting the
// CSS engine's own dvh recompute timing.
(function(){
  function setAppHeight(){
    var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  setAppHeight();
  window.addEventListener('resize', setAppHeight);
  window.addEventListener('orientationchange', setAppHeight);
  if(window.visualViewport) window.visualViewport.addEventListener('resize', setAppHeight);
})();
</script>
<link rel="stylesheet" href="style.css">
</head>
